<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>AntFarm</title>
    <link rel="icon" href="TemplateData/icon.png">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #12141a; overscroll-behavior: none; }
      /* 손가락 끌기·핀치를 브라우저(쪽 굴리기·확대·당겨서 새로고침)가 가져가지 않고 앱이 받게 */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #12141a; outline: none;
                      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* 휴대폰을 세로로 들면: 앱처럼 가로 화면만 쓴다 */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #12141a; color: #e6eaf0; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
                font: 16px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; text-align: center; }
      #rotate img { width: 72px; height: 72px; }
      @media (orientation: portrait) and (max-width: 600px) { #rotate { display: flex; } }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
                 color: #e6eaf0; font: 15px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
      #loading img { width: 96px; height: 96px; }
      #bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #2a2f36; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f2ad40; transition: width .2s; }
      #err { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 80vw; padding: 10px 14px; border-radius: 6px;
             background: #3a1d1d; color: #ffb4a8; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; white-space: pre-wrap; }
      #err:empty { display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><img src="TemplateData/icon.png" alt=""><div>개미 수조를 불러오는 중…</div><div id="bar"><div id="fill"></div></div></div>
    <div id="err"></div>
    <div id="rotate"><img src="TemplateData/icon.png" alt=""><div>휴대폰을 가로로 돌려 주세요</div></div>
    <script src="Build/715dd33ebe3a0c6d367fcc210bde019e.loader.js"></script>
    <script>
      const canvas = document.getElementById("unity-canvas");
      const err = m => { document.getElementById("err").textContent = m; };
      canvas.addEventListener("contextmenu", e => e.preventDefault()); // 오른쪽 버튼으로 끌어 화면을 옮긴다
      // 휴대폰: 화면을 누르면 전체 화면으로(주소 막대만큼 넓어진다) 하고 가로로 고정한다(되는 브라우저만, 아이폰 사파리는 안 된다)
      if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
        canvas.addEventListener("touchend", () => {
          const el = document.documentElement;
          if (document.fullscreenElement || !el.requestFullscreen) return;
          el.requestFullscreen({ navigationUI: "hide" }).then(() => screen.orientation?.lock?.("landscape")).catch(() => {});
        });
      }
      const start = () => createUnityInstance(canvas, {
        dataUrl: "Build/b0fcee6cea7920f3c281c653ecdfe631.data.unityweb",
        frameworkUrl: "Build/eae07d812b99df0bd34d2fd905064492.framework.js.unityweb",
        codeUrl: "Build/5a15d6fc792d49df0a0c46fd8eb95e84.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MyApps",
        productName: "AntFarm",
        productVersion: "1.3.0",
        autoSyncPersistentDataPath: true, // 저장한 개미집이 브라우저(IndexedDB)에 남아 다음에 와도 보이게
        // 파일 이름이 내용 해시라 같은 이름이면 내용도 같다: 데이터를 매번 서버에 다시 묻지 않는다
        cacheControl: url => url.endsWith("b0fcee6cea7920f3c281c653ecdfe631.data.unityweb") ? "immutable" : "no-store",
        showBanner: (msg, type) => { if (type === "error") err(msg); },
      }, p => { document.getElementById("fill").style.width = 100 * p + "%"; })
        .then(u => {
          document.getElementById("loading").remove(); canvas.focus();
          // 브라우저는 앱이 뒤로 갈 때 알림(OnApplicationPause)이 없어, 쪽이 가려지면 직접 알린다(휴대폰 배치면 자동 저장)
          document.addEventListener("visibilitychange", () => { if (document.hidden) u.SendMessage("AntFarm", "WebHidden"); });
        })
        .catch(err);
      // 저장은 브라우저 안(IndexedDB)에 있고 탭마다 제 복사본을 들고 있다가, 저장할 때 그 복사본에 없는 파일은 지운다 →
      // 두 탭이 서로의 저장을 지운다. 그래서 한 번에 한 탭만 연다(다른 탭이 닫히면 기다리던 탭이 이어서 연다. 새로 고침은 막지 않는다)
      if (navigator.locks) {
        const busy = setTimeout(() => err("이미 다른 탭에서 열려 있어요. 그 탭을 닫으면 여기서 이어서 열려요."), 1000);
        navigator.locks.request("antfarm", () => { clearTimeout(busy); err(""); return new Promise(start); }); // 끝나지 않는 약속 = 쪽이 살아 있는 동안 잠금
      } else start();
    </script>
  </body>
</html>
